name: Chợ Đồ Cũ Sinh Viên - CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - "feat/**"
  pull_request:
    branches:
      - main
      - master
      - "feat/**"

jobs:
  # ============================================================================
  # JOB 1: KIỂM TRA BẢO MẬT (.env) & LINT CODE (Ruff)
  # ============================================================================
  security-and-lint:
    name: Security Check (.env) & Backend Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify no .env file is committed to Git
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1 || git ls-files --error-unmatch backend/.env >/dev/null 2>&1 || git ls-files --error-unmatch frontend/.env >/dev/null 2>&1; then
            echo "❌ CRITICAL SECURITY ERROR: File .env bị commit vào kho lưu trữ Git!"
            exit 1
          fi
          echo "✅ Không phát hiện file .env nào bị commit trong Git."

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Ruff Linter
        run: pip install ruff>=0.4.0

      - name: Run Ruff Linter on Backend
        working-directory: backend
        run: ruff check .

  # ============================================================================
  # JOB 2: KIỂM THỬ BACKEND, ALEMBIC MIGRATION & COVERAGE >= 70%
  # ============================================================================
  backend-test:
    name: Backend Tests, Alembic Migrations & Coverage (>=70%)
    runs-on: ubuntu-latest
    needs: security-and-lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chodocu_test_user
          POSTGRES_PASSWORD: chodocu_test_password
          POSTGRES_DB: chodocusinhvien_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U chodocu_test_user -d chodocusinhvien_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://chodocu_test_user:chodocu_test_password@localhost:5432/chodocusinhvien_test_db
      JWT_SECRET_KEY: ci-test-secret-key-chodocusinhvien-2026
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      DAILY_LISTING_LIMIT: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Alembic Migrations (Upgrade -> Downgrade -> Upgrade)
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run Pytest with Coverage (>= 70%)
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70

  # ============================================================================
  # JOB 3: KIỂM TRA BUILD GIAO DIỆN REACT FRONTEND
  # ============================================================================
  frontend-build:
    name: Frontend Build Verification (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies & Build Frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1
        run: |
          npm ci
          npm run build
