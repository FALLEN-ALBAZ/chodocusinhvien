# ==============================================================================
# CẤU HÌNH NGINX REVERSE PROXY & STATIC SERVER (Non-Root Port 8080)
# Kiến trúc luồng request chuẩn ĐG2:
# Trình duyệt (Browser) ---> Nginx (80:8080) ---> React SPA (/usr/share/nginx/html)
#                                            ---> FastAPI Backend (http://api:8000)
# ==============================================================================

server {
    # Lắng nghe trên cổng 8080 vì container chạy dưới quyền non-root (UID 101 - user nginx)
    # không cần đặc quyền root để bind cổng < 1024
    listen 8080;
    server_name localhost;

    # Cho phép upload nhiều ảnh sản phẩm (tối đa 20MB mỗi request)
    client_max_body_size 20M;

    # Bật nén Gzip để tăng tốc độ tải trang
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. Phục vụ giao diện React SPA (Static Build)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Hỗ trợ React Router (SPA): mọi route phía client đều fallback về index.html
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy toàn bộ các request REST API (/api/...) sang FastAPI container
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Reverse Proxy tài liệu Swagger UI (/docs) và ReDoc (/redoc) & OpenAPI schema
    location /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /redoc {
        proxy_pass http://api:8000/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. Reverse Proxy thư mục ảnh sản phẩm đã upload (/uploads/...) sang FastAPI
    location /uploads/ {
        proxy_pass http://api:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
